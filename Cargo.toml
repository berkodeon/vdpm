[package]
name = "vdpm"
version = "0.1.0"
edition = "2024"
description = "A small CLI for managing VisiData plugins"
license = "Apache-2.0"
repository = "https://github.com/berkodeon/vdpm"
homepage = "https://github.com/berkodeon/vdpm"

[package.metadata.deb]
maintainer = "berkodeon <berkgeylani@gmail.com>"
copyright = "2026, berkodeon"
extended-description = """\
A small CLI for managing VisiData plugins — install them, toggle them on and \
off, and see what's currently active, without hand-editing .visidatarc."""
depends = "$auto"
section = "utils"
priority = "optional"
assets = [
    ["target/release/vdpm", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/vdpm/README.md", "644"],
]

[dependencies]
directories = "4.0"
toml = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_derive = "1.0"
notify = "8.0.0"
sha2 = "0.10.9"
polars = { version = "0.48.1", features = ["csv", "semi_anti_join", "dtype-u8"] }
libc = "0.2"
log = "0.4"
clap = { version = "4.5", features = ["derive"] }
chrono = "0.4.41"
tokio = { version = "1.48.0", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "local-time"] }
tracing-appender = "0.2.3"
reqwest = "0.12.24"
anyhow = "1.0"
serde_json = "1.0.145"
tabled = "0.20.0"
csv = "1.4.0"
regex = "1.12.2"

[dev-dependencies]
assert_cmd = "2.2.2"
assert_fs = "1.1.4"
predicates = "3.1.4"
rstest = "0.26.1"
insta = { version = "1.48.0", features = ["filters"] }
httpmock = "0.8.3"
